# Dependencies
markdown:         kramdown
highlighter:      rouge

# Permalinks
permalink:        pretty

# Server
source:           docs
destination:      _gh_pages
host:             0.0.0.0
port:             9001
url:              https://getbootstrap.com
baseurl:          /docs/3.4
encoding:         UTF-8
exclude:
  - assets/less/

plugins:
  - jekyll-sitemap

# Custom vars
title:            Bootstrap
description:      "The world's most popular mobile-first and responsive front-end framework."
current_version:  3.4.2
docs_version:     3.4
repo:             https://github.com/byteworks-ch/bootstrap

download:
  source:         https://github.com/byteworks-ch/bootstrap/v3.4.2.zip
  dist:           https://github.com/byteworks-ch/bootstrap/releases/download/v3.4.2/bootstrap-3.4.2-dist.zip

blog:             https://blog.getbootstrap.com
expo:             https://expo.getbootstrap.com
themes:           https://themes.getbootstrap.com
